name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel older runs of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Must match toolchainVersion in gradle/gradle-daemon-jvm.properties
          java-version: 25

      # Caches Gradle dependencies and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
